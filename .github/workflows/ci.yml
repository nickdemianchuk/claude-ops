name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore: [main]
    tags-ignore: ['**']

jobs:
  lint-pr:
    if: github.event_name == 'pull_request'
    uses: nickdemianchuk/actions/.github/workflows/lint-pr.yml@main

  lint-commits:
    if: github.event_name == 'push'
    uses: nickdemianchuk/actions/.github/workflows/lint-commits.yml@main

  lint-settings:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: fetch schema
        run: curl -fsSL -o "$RUNNER_TEMP/schema.json" https://json.schemastore.org/claude-code-settings.json
      - name: validate settings/*.json
        run: npx --yes ajv-cli@5.0.0 validate --strict=false --validate-formats=false -s "$RUNNER_TEMP/schema.json" -d "settings/*.json"

  lint-mcps:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: validate mcps/*.json
        run: |
          for f in mcps/*.json; do
            jq -e '.type | IN("stdio", "sse", "http")' "$f" >/dev/null
          done

  lint-skills:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: validate skills/*/SKILL.md frontmatter
        run: |
          for d in skills/*/; do
            f="$d/SKILL.md"
            test -f "$f" || { echo "$d has no SKILL.md"; exit 1; }
            head -1 "$f" | grep -qx -- '---' || { echo "$f: no opening frontmatter marker"; exit 1; }
            fm="$(sed -n '2,/^---$/p' "$f")"
            grep -qE '^name:[[:space:]]*[^[:space:]]' <<<"$fm" || { echo "$f: frontmatter has no name"; exit 1; }
            grep -qE '^description:[[:space:]]*[^[:space:]]' <<<"$fm" || { echo "$f: frontmatter has no description"; exit 1; }
            test "$(grep -E '^name:' <<<"$fm" | sed -E 's/^name:[[:space:]]*//')" = "$(basename "$d")" \
              || { echo "$f: name does not match its directory"; exit 1; }
            echo "ok $f"
          done

  lint-shell:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck install.sh uninstall.sh hooks/*.sh tests/*.sh

  test-hooks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: run hook tests
        run: |
          for t in tests/*.test.sh; do
            echo "== $t"
            bash "$t"
          done

  test-install:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: install, re-install, uninstall round-trip
        run: bash tests/install-roundtrip.test.sh
